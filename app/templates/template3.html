<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Derec - Periodontal Probing Offcanvas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --perio-blue: #5bc0de;
            --perio-red: #ff5c5c;
            --perio-yellow: #f0ad4e;
            --bg-offcanvas: #ffffff;
            --text-dark: #333;
            --border-light: #e9ecef;
        }

        /* Estilos de los cuadros de medición (los 6 puntos) */
        .perio-measure-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .measure-box {
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 15px 5px;
            text-align: center;
            position: relative;
            min-height: 100px;
        }

        .measure-box.active { border-color: #007bff; background-color: #f0f7ff; }

        .measure-val { font-size: 32px; font-weight: 300; line-height: 1; }
        .measure-label { font-size: 10px; color: #999; text-transform: uppercase; margin-top: 20px; }
        
        /* Círculo de margen gingival (el número pequeño abajo) */
        .margin-circle {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 20px;
            border: 1px solid #ddd;
            border-radius: 50%;
            font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #ccc;
        }

        /* Puntos indicadores (Sangrado/Placa) */
        .dot-indicators { position: absolute; top: 8px; right: 8px; display: flex; gap: 3px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-red { background-color: var(--perio-red); }
        .dot-blue { background-color: var(--perio-blue); }

        /* Teclado numérico de profundidad */
        .probing-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background-color: #eee;
            border: 1px solid #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .probing-btn {
            background: white; border: none; padding: 15px 0;
            font-size: 16px; color: #5bc0de; transition: 0.2s;
        }
        .probing-btn:hover { background: #f8f9fa; }
        .probing-btn.selected { background: #7a869a; color: white; }

        /* Botones de estado (Bleeding, Plaque, etc) */
        .status-toggle-group .btn {
            border-radius: 6px; margin-bottom: 10px; padding: 12px;
            font-weight: 500; display: flex; align-items: center; justify-content: center;
            border: none; background-color: #f1f3f5; color: #495057;
        }
        .btn-bleeding.active { background-color: #7a869a !important; color: white !important; position: relative; }
        .btn-bleeding.active::after { content: ''; position: absolute; right: 10px; width: 8px; height: 8px; background: var(--perio-red); border-radius: 50%; }

        .btn-plaque.active { background-color: #7a869a !important; color: white !important; position: relative; }
        .btn-plaque.active::after { content: ''; position: absolute; right: 10px; width: 8px; height: 8px; background: var(--perio-blue); border-radius: 50%; }

        .btn-next { background-color: #5bc0de; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; margin-top: 20px; }

        .offcanvas-header { border-bottom: 1px solid #eee; }
        .tooth-nav { display: flex; align-items: center; gap: 20px; color: #777; }
    </style>
</head>
<body>

<div class="p-5">
    <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasPerio">
        Abrir Periodontal Probing (Diente 12)
    </button>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasPerio" style="width: 450px;">
    <div class="offcanvas-header">
        <div class="tooth-nav">
            <i class="fas fa-chevron-left"></i>
            <i class="fas fa-chevron-right"></i>
            <span style="font-weight: 600; color: #333;">Tooth 12</span>
        </div>
        <div class="ms-auto">
            <i class="fas fa-volume-up me-3 text-primary"></i>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
    </div>

    <div class="offcanvas-body">
        <div class="perio-measure-grid">
            <div class="measure-box">
                <div class="dot-indicators"><div class="dot dot-red"></div><div class="dot dot-blue"></div></div>
                <div class="measure-val">2</div>
                <div class="margin-circle">0</div>
                <div class="measure-label">Disto Palatal</div>
            </div>
            <div class="measure-box">
                <div class="measure-val">1</div>
                <div class="margin-circle">0</div>
                <div class="measure-label">Palatal</div>
            </div>
            <div class="measure-box">
                <div class="dot-indicators"><div class="dot dot-red"></div><div class="dot dot-blue"></div></div>
                <div class="measure-val">3</div>
                <div class="margin-circle">0</div>
                <div class="measure-label">Mesio Palatal</div>
            </div>
            <div class="measure-box active">
                <div class="dot-indicators"><div class="dot dot-red"></div><div class="dot dot-blue"></div></div>
                <div class="measure-val">2</div>
                <div class="margin-circle">0</div>
                <div class="measure-label">Disto Buccal</div>
            </div>
            <div class="measure-box">
                <div class="dot-indicators"><div class="dot dot-red"></div><div class="dot dot-blue"></div></div>
                <div class="measure-val">1</div>
                <div class="margin-circle">0</div>
                <div class="measure-label">Buccal</div>
            </div>
            <div class="measure-box">
                <div class="dot-indicators"><div class="dot dot-red"></div><div class="dot dot-blue"></div></div>
                <div class="measure-val">3</div>
                <div class="margin-circle">0</div>
                <div class="measure-label">Mesio Buccal</div>
            </div>
        </div>

        <div class="d-flex justify-content-between mb-2 small text-muted">
            <span class="fw-bold text-primary">PROBING DEPTH</span>
            <span>GINGIVAL MARGIN</span>
        </div>
        <div class="probing-grid mb-4">
            <button class="probing-btn">0</button>
            <button class="probing-btn">1</button>
            <button class="probing-btn selected">2</button>
            <button class="probing-btn">3</button>
            <button class="probing-btn">4</button>
            <button class="probing-btn">5</button>
            <button class="probing-btn">6</button>
            <button class="probing-btn">7</button>
            <button class="probing-btn">8</button>
            <button class="probing-btn">9</button>
            <button class="probing-btn">10</button>
            <button class="probing-btn">11</button>
            <button class="probing-btn">12</button>
            <button class="probing-btn" style="grid-column: span 2;">>12</button>
        </div>

        <div class="status-toggle-group">
            <button class="btn w-100 btn-bleeding active">Bleeding</button>
            <div class="row g-2">
                <div class="col-4"><button class="btn w-100 btn-plaque active">Plaque</button></div>
                <div class="col-4"><button class="btn w-100">Pus</button></div>
                <div class="col-4"><button class="btn w-100">Tartar</button></div>
            </div>
        </div>

        <button class="btn-next">NEXT TOOTH</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
